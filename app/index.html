<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home Finder</title>
<meta name="description" content="Best rental deals near you, compared across sites.">
<meta name="theme-color" content="#2f6f5e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
<script type="module" src="app.js"></script>
</head>
<body>
  <!-- Signed-out / not-allowed / setup messages -->
  <section id="gate" class="gate" hidden>
    <img src="icons/icon-192.png" alt="" width="72" height="72">
    <h1>Home Finder</h1>
    <p id="gateMsg" class="muted">Rental deals near you, compared across sites.</p>
    <button id="signInBtn" class="btn primary" hidden>Sign in with Google</button>
    <button id="gateSignOut" class="btn" hidden>Sign out</button>
  </section>

  <div id="app" hidden>
    <header class="topbar">
      <div>
        <h1 id="viewTitle">Deals</h1>
        <div id="updated" class="muted small"></div>
      </div>
      <div class="topbar-actions">
        <button id="installBtn" class="btn small" hidden>Install</button>
        <button id="menuBtn" class="iconbtn" aria-label="Account">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        </button>
      </div>
    </header>
    <div id="menu" class="menu" hidden>
      <div id="menuEmail" class="muted small"></div>
      <button id="signOutBtn" class="btn small">Sign out</button>
    </div>

    <main id="views">
      <section id="view-deals" class="view">
        <div class="filters">
          <div class="filter-row">
            <select id="fSort" aria-label="Sort">
              <option value="score">Best deal</option>
              <option value="price">Lowest price</option>
              <option value="below">Most below market</option>
              <option value="dom">Longest listed</option>
              <option value="distance">Closest</option>
              <option value="new">Newest</option>
            </select>
            <input id="fMax" type="number" inputmode="numeric" placeholder="Max $" aria-label="Max rent" step="50">
            <input id="fBeds" type="number" inputmode="numeric" placeholder="Beds" aria-label="Min beds" min="0">
          </div>
          <div class="chips" id="flagChips"></div>
          <div class="filter-row toggles">
            <label><input type="checkbox" id="fMatch" checked> My filters</label>
            <label><input type="checkbox" id="fHidden"> Show hidden</label>
          </div>
          <div id="areaSummary" class="summary"></div>
        </div>
        <div id="dealList" class="list"></div>
      </section>

      <section id="view-map" class="view" hidden>
        <div id="map" class="bigmap"></div>
      </section>

      <section id="view-saved" class="view" hidden>
        <div id="savedList" class="list"></div>
      </section>

      <section id="view-add" class="view" hidden>
        <form id="addForm" class="form" autocomplete="off">
          <p class="muted small">Found a place on another site? Add it here. It shows up in Deals
            (matched against other sites and scored) after the next update from the PC.</p>
          <label>Link <input name="url" type="url" inputmode="url" placeholder="https://…"></label>
          <div class="grid2">
            <label>Site
              <select name="source">
                <option>zillow</option><option>apartments.com</option><option>craigslist</option>
                <option>facebook</option><option>realtor.com</option><option>hotpads</option>
                <option>trulia</option><option value="other">other</option>
              </select>
            </label>
            <label>Rent ($/mo) <input name="price" type="number" inputmode="numeric" required min="1"></label>
          </div>
          <label>Street address <input name="address" placeholder="123 Main St"></label>
          <div class="grid3">
            <label>Unit <input name="unit"></label>
            <label>ZIP <input name="zip" inputmode="numeric" maxlength="10"></label>
            <label>Sq ft <input name="sqft" type="number" inputmode="numeric"></label>
          </div>
          <div class="grid2">
            <label>Beds <input name="beds" type="number" inputmode="decimal" min="0" step="1"></label>
            <label>Baths <input name="baths" type="number" inputmode="decimal" min="0" step="0.5"></label>
          </div>
          <fieldset>
            <legend>Pets allowed</legend>
            <div class="checks" id="petChecks"></div>
          </fieldset>
          <fieldset>
            <legend>Amenities</legend>
            <div class="checks" id="amenityChecks"></div>
          </fieldset>
          <label>Location <span class="muted small">(tap the map)</span></label>
          <div id="pickMap" class="pickmap"></div>
          <div id="pickInfo" class="muted small">No location set. Distance and comps need one.</div>
          <button class="btn primary" type="submit">Add listing</button>
          <div id="addMsg" class="small" role="status"></div>
        </form>
        <h2 class="section-h">Added from phone</h2>
        <div id="subList" class="list"></div>
      </section>
    </main>

    <nav class="tabbar" aria-label="Sections">
      <button data-view="deals" class="active">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <span>Deals</span></button>
      <button data-view="map">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="9.5" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        <span>Map</span></button>
      <button data-view="saved">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        <span>Saved</span></button>
      <button data-view="add">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <span>Add</span></button>
    </nav>
  </div>

  <!-- Listing detail -->
  <div id="sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-body">
      <div class="sheet-head">
        <button id="sheetClose" class="iconbtn" aria-label="Close">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div id="sheetContent"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>
</body>
</html>
