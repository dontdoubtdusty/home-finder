<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bebe's Home Search</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23FF8DB5'/%3E%3Cpath d='M32 30C24 18 10 14 9 23c-1 9 8 17 23 7zM32 30c8-12 22-16 23-7 1 9-8 17-23 7z' fill='%23E60026'/%3E%3Ccircle cx='32' cy='30' r='6' fill='%23E60026' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --bg: #fff5f8; --dot: #ffe1ec; --panel: #ffffff; --text: #3a2a31; --muted: #8c6f7b;
    --line: #f7d3e0; --pink: #ff8db5; --pink-strong: #d6336c; --soft: #ffe4ee;
    --bow: #e60026; --bow-dark: #b0001e; --yellow: #ffd23f; --yellow-text: #8a6200;
    --berry: #9b4dca; --ok: #2f8a57; --on-pink: #ffffff;
    --shadow: 0 8px 24px rgba(214, 51, 108, .12); --shadow-sm: 0 2px 8px rgba(214, 51, 108, .08);
    --font: "Segoe UI Variable Text", "Segoe UI", Roboto, system-ui, -apple-system, sans-serif;
    --font-display: "Segoe UI Variable Display", "Segoe UI", Roboto, system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1f1519; --dot: #2a1c22; --panel: #2a1d23; --text: #fbeff4; --muted: #c7a5b3;
      --line: #46303a; --pink: #ff8db5; --pink-strong: #ff9cc0; --soft: #3a2530;
      --bow: #ff4d6d; --bow-dark: #ff4d6d; --yellow: #ffd23f; --yellow-text: #ffd96a;
      --berry: #d3a4f0; --ok: #7fd6a2; --on-pink: #2a1018;
      --shadow: 0 8px 24px rgba(0,0,0,.45); --shadow-sm: 0 2px 8px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1f1519; --dot: #2a1c22; --panel: #2a1d23; --text: #fbeff4; --muted: #c7a5b3;
    --line: #46303a; --pink: #ff8db5; --pink-strong: #ff9cc0; --soft: #3a2530;
    --bow: #ff4d6d; --bow-dark: #ff4d6d; --yellow: #ffd23f; --yellow-text: #ffd96a;
    --berry: #d3a4f0; --ok: #7fd6a2; --on-pink: #2a1018;
    --shadow: 0 8px 24px rgba(0,0,0,.45); --shadow-sm: 0 2px 8px rgba(0,0,0,.35);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--text); font: 14.5px/1.45 var(--font);
    background-color: var(--bg);
    background-image: radial-gradient(var(--dot) 2.2px, transparent 2.6px);
    background-size: 26px 26px;
    display: flex; flex-direction: column;
  }
  button { font: inherit; }
  a { color: var(--pink-strong); }

  /* Header */
  header {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 14px 20px; background: var(--panel); border-bottom: 2px solid var(--line);
    box-shadow: var(--shadow-sm); position: relative; z-index: 500;
  }
  .logo { width: 52px; height: 52px; flex: none; border-radius: 16px; background: var(--pink);
          display: grid; place-items: center; box-shadow: var(--shadow-sm); }
  .title h1 { margin: 0; font: 700 24px/1.15 var(--font-display); letter-spacing: -.01em; }
  .title h1 .heart { color: var(--bow); }
  .sub { color: var(--muted); font-size: 13px; }
  .head-right { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .pill { background: var(--soft); color: var(--pink-strong); border-radius: 999px; padding: 6px 12px;
          font-size: 12.5px; font-weight: 600; }
  .btn { border: 2px solid var(--line); background: var(--panel); color: var(--text); border-radius: 999px;
         padding: 8px 16px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
  .btn:hover { border-color: var(--pink); }
  .btn.primary { background: var(--pink-strong); border-color: var(--pink-strong); color: var(--on-pink); box-shadow: var(--shadow-sm); }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn svg { width: 18px; height: 18px; }

  /* Medians + controls */
  .bar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; padding: 12px 20px;
         background: color-mix(in srgb, var(--panel) 88%, transparent); border-bottom: 2px solid var(--line); }
  .stat { background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 6px 12px; font-size: 13px; }
  .stat b { color: var(--pink-strong); font-variant-numeric: tabular-nums; font-size: 15px; }
  .controls label { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13.5px; }
  .controls input[type=number], .controls select {
    width: 120px; padding: 7px 10px; border: 2px solid var(--line); border-radius: 12px;
    background: var(--panel); color: var(--text); font: inherit; }
  .controls input[type=checkbox] { accent-color: var(--pink-strong); width: 16px; height: 16px; }
  .chip { border: 2px solid var(--line); background: var(--panel); color: var(--text);
          border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: 13px; }
  .chip[aria-pressed="true"] { background: var(--soft); border-color: var(--pink); color: var(--pink-strong); font-weight: 600; }
  .spacer { flex: 1; }

  /* Main */
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 16px; padding: 16px 20px 20px; }
  #mapWrap { border-radius: 22px; overflow: hidden; border: 3px solid var(--panel); box-shadow: var(--shadow); min-height: 420px; }
  #map { height: 100%; }
  #list { overflow-y: auto; padding: 2px 6px 2px 2px; }
  .card { background: var(--panel); border: 2px solid var(--line); border-radius: 20px; padding: 14px 16px;
          margin-bottom: 12px; cursor: pointer; box-shadow: var(--shadow-sm); transition: transform .12s, border-color .12s; }
  .card:hover { transform: translateY(-1px); border-color: var(--pink); }
  .card.sel { border-color: var(--pink-strong); box-shadow: 0 0 0 3px var(--soft), var(--shadow); }
  .card.dim { opacity: .6; }
  .row1 { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .price { font: 700 21px var(--font-display); font-variant-numeric: tabular-nums; }
  .price small { font: 500 13px var(--font); color: var(--muted); }
  .score { background: var(--soft); color: var(--pink-strong); font-weight: 700; font-size: 12.5px;
           border-radius: 999px; padding: 3px 10px; white-space: nowrap; }
  .addr { margin: 3px 0 4px; font-weight: 600; }
  .meta { color: var(--muted); font-size: 13px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tag { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--soft); }
  .tag.below_market { color: var(--bow-dark); } .tag.price_drop { color: var(--berry); }
  .tag.stale { color: var(--yellow-text); background: color-mix(in srgb, var(--yellow) 22%, var(--panel)); }
  .tag.cheapest_site { color: var(--ok); } .tag.unknown { color: var(--muted); font-weight: 500; }
  .others { margin-top: 8px; font-size: 13px; color: var(--muted); }
  .links { margin-top: 6px; font-size: 13px; }
  .empty { text-align: center; color: var(--muted); padding: 48px 16px; }
  .empty h2 { color: var(--text); font: 700 20px var(--font-display); margin: 12px 0 6px; }
  .leaflet-popup-content { font: 13px/1.4 var(--font); }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip { border-radius: 14px; }

  /* Refresh dialog / progress */
  .overlay { position: fixed; inset: 0; z-index: 1000; background: rgba(58, 42, 49, .35); display: grid; place-items: center; padding: 16px; }
  .dialog { background: var(--panel); border-radius: 24px; padding: 22px 24px; width: min(440px, 100%);
            box-shadow: var(--shadow); border: 3px solid var(--soft); }
  .dialog h2 { margin: 0 0 6px; font: 700 20px var(--font-display); }
  .dialog p { margin: 6px 0; color: var(--muted); }
  .dialog .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }
  .log { margin-top: 10px; background: var(--bg); border-radius: 14px; padding: 10px 12px; font-size: 12.5px;
         max-height: 180px; overflow-y: auto; color: var(--muted); white-space: pre-wrap; }
  .hearts { display: flex; gap: 6px; justify-content: center; margin: 8px 0 2px; }
  .hearts span { width: 12px; height: 12px; background: var(--pink); transform: rotate(45deg); position: relative;
                 animation: hop 1s ease-in-out infinite; }
  .hearts span::before, .hearts span::after { content: ""; position: absolute; width: 12px; height: 12px; border-radius: 50%; background: inherit; }
  .hearts span::before { left: -6px; } .hearts span::after { top: -6px; }
  .hearts span:nth-child(2) { animation-delay: .15s; background: var(--bow); }
  .hearts span:nth-child(3) { animation-delay: .3s; }
  @keyframes hop { 0%, 100% { transform: rotate(45deg) translate(0, 0); } 50% { transform: rotate(45deg) translate(-5px, -5px); } }
  @media (prefers-reduced-motion: reduce) { .hearts span { animation: none; } .card { transition: none; } }

  @media (max-width: 860px) {
    main { grid-template-columns: 1fr; }
    #mapWrap { min-height: 320px; height: 320px; }
    #list { overflow: visible; }
    header { padding: 12px 16px; } .bar { padding: 10px 16px; } main { padding: 12px 16px 16px; }
  }
</style>
</head>
<body>
<header>
  <div class="logo" aria-hidden="true">
    <svg viewBox="0 0 64 40" width="40" height="26"><path d="M32 20C22 6 6 2 4 12s6 22 28 8zM32 20C42 6 58 2 60 12s-6 22-28 8z" fill="#e60026" stroke="#b0001e" stroke-width="1.5" stroke-linejoin="round"/><ellipse cx="32" cy="20" rx="7" ry="8" fill="#e60026" stroke="#fff" stroke-width="2.5"/></svg>
  </div>
  <div class="title">
    <h1>Bebe's Home Search <span class="heart" aria-hidden="true">♥</span></h1>
    <div class="sub" id="sub">Loading…</div>
  </div>
  <div class="head-right">
    <span class="pill" id="usage" hidden></span>
    <button class="btn" id="rescoreBtn" hidden title="Recalculate deals from saved listings (no API use)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3M18 3v4h-4M6 21v-4h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Re-rank</button>
    <button class="btn primary" id="refreshBtn" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>
      Find new listings</button>
  </div>
</header>

<div class="bar" id="summary"></div>
<div class="bar controls">
  <label><input type="checkbox" id="onlyMatch" checked> Only my must-haves</label>
  <label>Max rent <input type="number" id="maxRent" step="50" min="0" placeholder="Any"></label>
  <label>Beds ≥ <input type="number" id="minBeds" step="1" min="0" placeholder="Any"></label>
  <label>Sort <select id="sort">
    <option value="score">Best deal</option>
    <option value="price">Lowest price</option>
    <option value="below">Most below market</option>
    <option value="dom">Longest on market</option>
    <option value="distance">Closest</option>
  </select></label>
  <span class="spacer"></span>
  <span id="flagBtns" style="display:flex;gap:8px;flex-wrap:wrap"></span>
</div>

<main>
  <div id="mapWrap"><div id="map"></div></div>
  <div id="list"></div>
</main>

<div class="overlay" id="overlay" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
    <h2 id="dlgTitle"></h2>
    <div id="dlgBody"></div>
    <div class="actions" id="dlgActions"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const TOKEN = new URLSearchParams(location.search).get("t");
  const DESKTOP = !!TOKEN && location.protocol.startsWith("http");
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g,
    (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const money = (n) => n == null ? "?" : "$" + Math.round(n).toLocaleString();
  const safeUrl = (u) => (typeof u === "string" && /^https?:\/\//i.test(u) ? u : null);
  const FLAG_LABELS = { below_market: "♥ Below market", price_drop: "Price drop", stale: "Long on market", cheapest_site: "Cheapest across sites" };
  const PINK = "#d6336c", BOW = "#e60026", GREY = "#c9a3b3";

  // --- desktop API (only when opened by the exe)
  const api = (path, method = "GET") => fetch(path, { method, headers: { "X-Token": TOKEN } })
    .then((r) => r.json().then((j) => ({ status: r.status, body: j })));

  // --- data (data.js via <script> so it also works when opened from disk)
  function loadData() {
    return new Promise((resolve) => {
      const s = document.createElement("script");
      s.src = "data.js" + (DESKTOP ? `?t=${encodeURIComponent(TOKEN)}&v=${Date.now()}` : "");
      s.onload = s.onerror = () => resolve(window.HOMEFINDER || null);
      document.head.appendChild(s);
    });
  }

  const state = { flags: new Set(), selected: null, D: null, map: null, layer: null, ring: null, markers: {} };

  function bedsLabel(b) { return b == null ? "? bd" : b === 0 ? "Studio" : `${b} bd`; }

  function header() {
    const D = state.D;
    if (!D) { $("sub").textContent = "No listings yet"; $("summary").innerHTML = ""; return; }
    const nMatch = D.listings.filter((l) => l.passes_filters).length;
    $("sub").textContent = `${nMatch} of ${D.listings.length} homes match · within ${D.center.radius_miles} mi · updated ${new Date(D.generated_at).toLocaleString([], { dateStyle: "medium", timeStyle: "short" })}`;
    $("summary").innerHTML = (D.summary || []).map((s) =>
      `<div class="stat">${esc(bedsLabel(s.beds))} usually <b>${money(s.median)}</b> <span class="sub">· ${s.count} homes</span></div>`).join("")
      || '<div class="sub">Area prices show up once there are listings.</div>';
  }

  function visible() {
    const D = state.D; if (!D) return [];
    const only = $("onlyMatch").checked, max = parseFloat($("maxRent").value), beds = parseFloat($("minBeds").value);
    const rows = D.listings.filter((l) =>
      (!only || l.passes_filters) && (isNaN(max) || l.price <= max) &&
      (isNaN(beds) || l.beds == null || l.beds >= beds) &&
      [...state.flags].every((f) => l.flags.includes(f)));
    const by = {
      score: (a, b) => b.score - a.score, price: (a, b) => a.price - b.price,
      below: (a, b) => (b.pct_below_market ?? -1e9) - (a.pct_below_market ?? -1e9),
      dom: (a, b) => b.days_on_market - a.days_on_market,
      distance: (a, b) => (a.distance_miles ?? 1e9) - (b.distance_miles ?? 1e9),
    }[$("sort").value];
    return rows.sort(by);
  }

  function link(l) {
    const u = safeUrl(l.url);
    if (u) return `<a href="${esc(u)}" target="_blank" rel="noopener">See it on ${esc(l.source)} ↗</a>`;
    const q = encodeURIComponent([l.address, l.unit, l.city, l.state, l.zip].filter(Boolean).join(" ") + " for rent");
    return `<a href="https://www.google.com/search?q=${q}" target="_blank" rel="noopener">Search this address ↗</a>`;
  }

  function card(l) {
    const addr = [l.address, l.unit].filter(Boolean).join(", ") || "Address not given";
    const place = [l.city, l.state, l.zip].filter(Boolean).join(", ");
    const meta = [bedsLabel(l.beds), l.baths == null ? "? ba" : l.baths + " ba",
      l.sqft ? Math.round(l.sqft).toLocaleString() + " sqft" : null,
      l.distance_miles != null ? l.distance_miles + " mi away" : null,
      l.days_on_market + " days listed", l.source].filter(Boolean).join(" · ");
    const tags = l.flags.map((f) => {
      let t = FLAG_LABELS[f] || f;
      if (f === "below_market") t += ` ${l.pct_below_market}%`;
      if (f === "price_drop") t += ` −${l.pct_price_drop}% (was ${money(l.peak_price)})`;
      if (f === "cheapest_site") t += ` · saves ${money(l.cross_site_spread)}`;
      return `<span class="tag ${esc(f)}">${esc(t)}</span>`;
    });
    l.unknown.forEach((u) => tags.push(`<span class="tag unknown">${esc(u)}?</span>`));
    const market = l.market_median != null
      ? `Similar homes nearby: ~${money(l.market_median)} (${l.comp_count} compared)`
      : `Not enough similar homes nearby to compare yet`;
    const others = l.other_listings.length ? `<div class="others">Also on: ${l.other_listings.map((o) => {
      const u = safeUrl(o.url);
      return (u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(o.source)}</a>` : esc(o.source)) + " " + money(o.price);
    }).join(" · ")}</div>` : "";
    return `<div class="card ${l.passes_filters ? "" : "dim"} ${state.selected === l.id ? "sel" : ""}" data-id="${esc(l.id)}">
      <div class="row1"><span class="price">${money(l.price)}<small> /mo</small></span><span class="score">deal score ${esc(l.score)}</span></div>
      <div class="addr">${esc(addr)} <span class="meta">${esc(place)}</span></div>
      <div class="meta">${esc(meta)}</div>
      <div class="meta">${esc(market)}</div>
      ${tags.length ? `<div class="tags">${tags.join("")}</div>` : ""}
      ${others}
      <div class="links">${link(l)}</div>
    </div>`;
  }

  function emptyState() {
    if (!state.D) {
      return `<div class="empty"><svg viewBox="0 0 64 40" width="72" height="45" aria-hidden="true"><path d="M32 20C22 6 6 2 4 12s6 22 28 8zM32 20C42 6 58 2 60 12s-6 22-28 8z" fill="${BOW}"/><ellipse cx="32" cy="20" rx="7" ry="8" fill="${BOW}" stroke="#fff" stroke-width="2.5"/></svg>
        <h2>No homes yet</h2><p>${DESKTOP ? "Click <b>Find new listings</b> to start your search." : "Run <code>py -m homefinder run</code> to start your search."}</p></div>`;
    }
    return `<div class="empty"><h2>Nothing matches right now</h2><p>Try a higher max rent, fewer beds, or untick "Only my must-haves".</p></div>`;
  }

  function color(l) {
    if (l.flags.includes("below_market") || l.flags.includes("cheapest_site")) return BOW;
    if (l.flags.length) return PINK;
    return GREY;
  }

  function ensureMap() {
    const D = state.D;
    if (!window.L) return;
    if (!state.map) {
      state.map = L.map("map").setView([39.8, -98.6], 4);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "&copy; OpenStreetMap contributors" }).addTo(state.map);
      state.layer = L.layerGroup().addTo(state.map);
    }
    if (D && !state.ring) {
      state.ring = L.circle([D.center.lat, D.center.lon], { radius: D.center.radius_miles * 1609.34, color: PINK, weight: 2, dashArray: "6 6", fillColor: "#ff8db5", fillOpacity: 0.06 }).addTo(state.map);
      L.marker([D.center.lat, D.center.lon], { icon: L.divIcon({ className: "", html: '<div style="font-size:22px;line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))">🎀</div>', iconSize: [22, 22], iconAnchor: [11, 11] }) })
        .addTo(state.map).bindTooltip("Search center");
      state.map.fitBounds(state.ring.getBounds());
    }
  }

  function render() {
    header();
    ensureMap();
    const rows = visible();
    $("list").innerHTML = rows.length ? rows.map(card).join("") : emptyState();
    if (!state.layer) return;
    state.layer.clearLayers(); state.markers = {};
    rows.forEach((l) => {
      if (l.latitude == null || l.longitude == null) return;
      const m = L.circleMarker([l.latitude, l.longitude], {
        radius: state.selected === l.id ? 10 : 7, color: "#fff", weight: 2, fillColor: color(l), fillOpacity: 0.95,
      }).bindPopup(`<b>${money(l.price)}</b> · ${esc(bedsLabel(l.beds))}<br>${esc(l.address || "")}<br>deal score ${esc(l.score)}`);
      m.on("click", () => select(l.id, false));
      m.addTo(state.layer); state.markers[l.id] = m;
    });
  }

  function select(id, pan) {
    state.selected = id; render();
    const el = document.querySelector(`.card[data-id="${CSS.escape(id)}"]`);
    if (el && !pan) el.scrollIntoView({ behavior: "smooth", block: "nearest" });
    const m = state.markers[id];
    if (m && pan) { state.map.panTo(m.getLatLng()); m.openPopup(); }
  }

  // --- controls
  $("flagBtns").innerHTML = Object.entries(FLAG_LABELS).map(([k, v]) =>
    `<button class="chip" data-flag="${k}" aria-pressed="false">${esc(v)}</button>`).join("");
  $("flagBtns").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    const f = b.dataset.flag;
    state.flags.has(f) ? state.flags.delete(f) : state.flags.add(f);
    b.setAttribute("aria-pressed", state.flags.has(f)); render();
  });
  ["onlyMatch", "maxRent", "minBeds", "sort"].forEach((id) => $(id).addEventListener("input", render));
  $("list").addEventListener("click", (e) => {
    if (e.target.closest("a")) return;
    const c = e.target.closest(".card"); if (c) select(c.dataset.id, true);
  });

  // --- dialogs
  function dialog(title, bodyHtml, actions) {
    $("dlgTitle").textContent = title;
    $("dlgBody").innerHTML = bodyHtml;
    $("dlgActions").innerHTML = "";
    actions.forEach(([label, cls, fn]) => {
      const b = document.createElement("button");
      b.className = "btn " + (cls || ""); b.textContent = label; b.onclick = fn;
      $("dlgActions").appendChild(b);
    });
    $("overlay").hidden = false;
    const first = $("dlgActions").querySelector(".primary") || $("dlgActions").querySelector("button");
    if (first) first.focus();
  }
  const closeDialog = () => ($("overlay").hidden = true);
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("dlgActions").dataset.busy !== "1") closeDialog(); });

  let lastStatus = null;
  async function refreshStatus() {
    try {
      const { body } = await api("api/status");
      lastStatus = body;
      if (body.rentcast && body.rentcast.enabled) {
        $("usage").hidden = false;
        $("usage").textContent = `${body.rentcast.used}/${body.rentcast.budget} searches used this month`;
      }
      return body;
    } catch { return null; }
  }

  async function runJob(kind) {
    const r = await api("api/" + kind, "POST");
    if (r.status === 409) { /* already running: just watch it */ }
    $("dlgActions").dataset.busy = "1";
    dialog(kind === "refresh" ? "Finding homes for Bebe…" : "Re-ranking deals…",
      '<div class="hearts" aria-hidden="true"><span></span><span></span><span></span></div><div class="log" id="jobLog" aria-live="polite">Starting…</div>', []);
    for (;;) {
      await new Promise((res) => setTimeout(res, 900));
      const s = await refreshStatus();
      if (!s) continue;
      $("jobLog").textContent = s.job.log.join("\n") || "Working…";
      $("jobLog").scrollTop = 1e6;
      if (!s.job.running) {
        $("dlgActions").dataset.busy = "0";
        state.D = await loadData();
        render();
        if (s.job.ok) {
          const n = state.D ? state.D.listings.filter((l) => l.passes_filters).length : 0;
          dialog("All done! ♥", `<p>${n} homes match what you're looking for.</p><div class="log">${esc(s.job.log.join("\n"))}</div>`,
            [["Yay!", "primary", closeDialog]]);
        } else {
          dialog("Something went wrong", `<p>Here's what happened:</p><div class="log">${esc(s.job.log.join("\n"))}</div>`,
            [["Close", "primary", closeDialog]]);
        }
        return;
      }
    }
  }

  $("refreshBtn").addEventListener("click", async () => {
    const s = await refreshStatus();
    if (s && s.config_error) {
      dialog("Setup needed", `<p>${esc(s.config_error)}</p>`, [["OK", "primary", closeDialog]]);
      return;
    }
    const rc = s && s.rentcast;
    const left = rc && rc.enabled ? rc.budget - rc.used : null;
    const note = left == null ? "" : left > 0
      ? `<p>This uses 1 of your RentCast searches (<b>${left}</b> left this month).</p>`
      : `<p><b>No RentCast searches left this month.</b> Homes from your imports and the phone app will still be updated.</p>`;
    dialog("Find new listings?", `<p>Checks for new homes, price drops, and listings that are gone.</p>${note}`,
      [["Not now", "", closeDialog], ["Find homes ♥", "primary", () => runJob("refresh")]]);
  });
  $("rescoreBtn").addEventListener("click", () => runJob("rescore"));

  // --- start
  if (DESKTOP) {
    $("refreshBtn").hidden = false; $("rescoreBtn").hidden = false;
    refreshStatus().then((s) => { if (s && s.job.running) runJob(s.job.kind); });
    // Heartbeat: lets the app quit cleanly after the window is closed.
    setInterval(() => fetch("api/ping", { method: "POST", headers: { "X-Token": TOKEN } }).catch(() => {}), 10000);
  }
  loadData().then((D) => { state.D = D; render(); });
})();
</script>
</body>
</html>
